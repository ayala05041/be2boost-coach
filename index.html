<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>be2boost | מאמן שיחות מכירה</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--navy:#0C1C35;--crimson:#B31E44;--orange:#EB562C;--bg:#F5F4EF;--card:#fff;--text:#0C1C35;--muted:#5d6678;--line:#dcdde3;--soft:#FFF4F0}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#081426;--card:#13294a;--text:#f6f9fe;--muted:#a9b4c8;--line:#27406a;--soft:#1a2f52}}
:root[data-theme=dark]{--bg:#081426;--card:#13294a;--text:#f6f9fe;--muted:#a9b4c8;--line:#27406a;--soft:#1a2f52}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Heebo","Assistant",Arial,sans-serif;line-height:1.6}
header{background:var(--navy);padding:20px;text-align:center;border-bottom:4px solid var(--orange)}
header img{max-width:min(280px,75%);height:auto}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 40px}
.tag{color:var(--orange);font-size:13px;letter-spacing:.06em;font-weight:700}
h1{font-size:28px;margin:4px 0}h2{font-size:19px;margin:0 0 10px}.muted{color:var(--muted)}.sm{font-size:13px;margin:-4px 0 8px}
.note{background:var(--soft);border-inline-start:4px solid var(--orange);padding:8px 12px;font-size:13px;color:var(--muted);border-radius:6px;margin:10px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0;border-top:4px solid var(--crimson)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:14px;font-weight:600;margin:8px 0}
input,select,textarea{width:100%;margin-top:4px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
button{background:linear-gradient(90deg,var(--crimson),var(--orange));color:#fff;border:0;border-radius:10px;padding:11px 22px;font:inherit;font-weight:700;cursor:pointer;margin-top:6px}
button:disabled{opacity:.5;cursor:default}
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ring{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring b{width:84px;height:84px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:30px}
.row{display:grid;grid-template-columns:170px 1fr 80px;gap:10px;align-items:center;margin:9px 0;font-size:15px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--crimson),var(--orange))}
.row span:last-child{text-align:left;color:var(--muted);font-size:13px}
.q{background:var(--navy);color:#f6f9fe;border-radius:12px;padding:12px 14px;margin:8px 0}
.say{background:var(--orange);color:#fff;border-radius:12px;padding:12px 14px;margin:8px 0;font-weight:600}
.lbl{font-size:12px;opacity:.8;display:block;margin-bottom:2px}
.flag{border-inline-start:4px solid var(--crimson);padding:4px 12px;margin:8px 0}
.cta{background:var(--navy);color:#fff;border-radius:14px;padding:18px;text-align:center;margin-top:20px}.cta b{color:var(--orange)}
@media(max-width:520px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr 80px}.row .bar{grid-column:1/3;order:3}}
</style></head><body>

<div class="wrap">
<div class="tag">מאמן שיחות מכירה / שיטת BOOST</div>
<h1>ניתוח שיחה</h1>
<section class="card" id="gate"><h2>כניסה</h2><label>סיסמת הצוות<input id="pw" type="password" autocomplete="current-password"></label><button id="enter">כניסה</button> <span id="gst" class="muted"></span></section>
<div id="app" hidden>
<p class="muted">העלי הקלטת שיחה וקבלי ציון, ציטוטים ומשפטים מוכנים לשיחה הבאה.</p>
<section class="card">
<div class="grid"><label>שם הנציגה<input id="rep" placeholder="לא חובה"></label>
<label>סוג שיחה<select id="type"><option>שיחת גילוי / שיחה ראשונה</option><option>שיחת הצעה</option><option>שיחת סגירה</option><option>פולואפ</option></select></label></div>
<label>קובץ הקלטה (mp3, m4a, wav, עד 24MB)<input id="file" type="file" accept="audio/*,video/mp4,.mp3,.m4a,.wav,.ogg,.webm"></label>
<label>או הדביקי תמלול<textarea id="tr" rows="6"></textarea></label>
<div class="note">ההקלטה והתמלול לא נשמרים באתר. ההקלטה נשלחת לשירות תמלול חיצוני לצורך הפיכתה לטקסט. הקפידי להודיע ללקוחה על הקלטת השיחה.</div>
<button id="go">נתחי את השיחה</button> <span id="st" class="muted"></span></section>
<div id="out"></div></div>
<div class="cta">רוצה לדייק את שיחות המכירה בעסק?<br><b>be2boost.com</b></div></div>
<script>
const $=id=>document.getElementById(id);
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
let pw='';
const H=()=>({'x-app-password':pw});
$('enter').onclick=async()=>{pw=$('pw').value;try{const r=await fetch('/api/check',{headers:H()});if(r.ok){$('gate').hidden=true;$('app').hidden=false}else $('gst').textContent='סיסמה שגויה'}catch(e){$('gst').textContent='אין חיבור לשרת'}};
$('pw').onkeydown=e=>{if(e.key==='Enter')$('enter').click()};
const MSG={transcribing:'מתמללת את ההקלטה...',analyzing:'מנתחת את השיחה...',queued:'בתור...'};
const ERR={short:'התמלול קצר מדי לניתוח.',too_large:'הקובץ גדול מדי (עד 24MB).',busy:'המערכת עסוקה, נסי עוד דקה.'};
$('go').onclick=async()=>{
 const f=$('file').files[0],t=$('tr').value.trim();
 if(!f&&!t){$('st').textContent='העלי קובץ או הדביקי תמלול.';return}
 $('go').disabled=true;$('out').replaceChildren();$('st').textContent='שולחת...';
 try{
  const headers=Object.assign(H(),{'x-call-type':encodeURIComponent($('type').value)});
  let body;
  if(f){headers['content-type']=f.type||'application/octet-stream';headers['x-filename']=encodeURIComponent(f.name);body=f}
  else{headers['content-type']='text/plain';body=t}
  const r=await fetch('/api/jobs',{method:'POST',headers,body});
  if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.error||'send')}
  const {id}=await r.json();
  for(;;){
   await new Promise(s=>setTimeout(s,3000));
   const p=await (await fetch('/api/jobs/'+id,{headers:H()})).json();
   if(p.status==='done'){render(p.result,$('rep').value.trim());$('st').textContent='';break}
   if(p.status==='error')throw new Error(p.error);
   $('st').textContent=MSG[p.status]||'מעבדת...';
  }
 }catch(e){$('st').textContent=ERR[e.message]||'הניתוח נכשל ('+e.message+'). נסי שוב או פני לאילה.'}
 $('go').disabled=false};
function render(d,rep){
 const o=$('out');o.replaceChildren();
 const ar=(d.areas||[]).filter(a=>!a.na);const sc=ar.reduce((s,a)=>s+(+a.score||0),0),mx=ar.reduce((s,a)=>s+(+a.max||0),0);
 const tot=mx?Math.round(sc/mx*100):0;
 const h=el('section','card');const hero=el('div','hero');
 const ring=el('div','ring');ring.style.background='conic-gradient(var(--crimson),var(--orange) 0 '+tot+'%,var(--line) 0)';ring.appendChild(el('b',null,tot));
 const hb=el('div');hb.appendChild(el('h2',null,'ציון כללי'+(rep?' | '+rep:'')));hb.appendChild(el('div',null,d.summary||''));
 if(d.assumptions)hb.appendChild(el('div','muted','הנחות: '+d.assumptions));
 hero.append(ring,hb);h.appendChild(hero);o.appendChild(h);
 const t=el('section','card');t.appendChild(el('h2',null,'ציון לפי תחום'));
 (d.areas||[]).forEach(a=>{const r=el('div','row');r.appendChild(el('span',null,a.name));const b=el('div','bar');const i=el('i');i.style.width=a.na?'0':Math.round((a.score/a.max)*100)+'%';b.appendChild(i);r.appendChild(b);r.appendChild(el('span',null,a.na?'לא רלוונטי':a.score+'/'+a.max));t.appendChild(r);
  if(a.missing&&!a.na)t.appendChild(el('div','muted sm','חסר: '+a.missing))});o.appendChild(t);
 if((d.worked||[]).length){const w=el('section','card');w.appendChild(el('h2',null,'מה עבד'));d.worked.forEach(x=>{w.appendChild(el('p',null,x.text));if(x.quote)w.appendChild(el('div','q','"'+x.quote+'"'))});o.appendChild(w)}
 (d.fixes||[]).forEach((f,n)=>{const c=el('section','card');c.appendChild(el('h2',null,'תיקון '+(n+1)+': '+f.title));
  const q=el('div','q');q.appendChild(el('span','lbl','מה נאמר בשיחה'));q.appendChild(document.createTextNode('"'+f.quote+'"'));c.appendChild(q);
  c.appendChild(el('p',null,f.why));
  const s=el('div','say');s.appendChild(el('span','lbl','במקום זה, אפשר לומר'));s.appendChild(document.createTextNode(f.say));c.appendChild(s);o.appendChild(c)});
 if((d.flags||[]).length){const c=el('section','card');c.appendChild(el('h2',null,'דגלים'));d.flags.forEach(x=>c.appendChild(el('div','flag',x)));o.appendChild(c)}
 const k=el('section','card');k.appendChild(el('h2',null,'משימה לשיחה הבאה'));k.appendChild(el('p',null,d.task||''));
 if((d.questions||[]).length){const u=el('ul');d.questions.forEach(x=>u.appendChild(el('li',null,x)));k.appendChild(u)}
 if((d.not_assessed||[]).length)k.appendChild(el('div','muted sm','לא נבדק מתמלול: '+d.not_assessed.join(', ')));o.appendChild(k);
 const bt=el('button',null,'שמירת הדוח כקובץ');bt.onclick=async()=>{try{const b=new Blob([toText(d,tot,rep)],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='be2boost-report.txt';a.click()}catch(e){}};o.appendChild(bt);
}
function toText(d,tot,rep){let s='be2boost | דוח ניתוח שיחה'+(rep?' | '+rep:'')+'\nציון: '+tot+'\n'+(d.summary||'')+'\n\n';
 (d.areas||[]).forEach(a=>s+=a.name+': '+(a.na?'לא רלוונטי':a.score+'/'+a.max)+'\n');
 (d.fixes||[]).forEach((f,n)=>s+='\nתיקון '+(n+1)+': '+f.title+'\nנאמר: "'+f.quote+'"\n'+f.why+'\nבמקום זה: '+f.say+'\n');
 s+='\nמשימה: '+(d.task||'')+'\n';return s}
</script>
